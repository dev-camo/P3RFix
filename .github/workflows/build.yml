name: Build packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
      version:
        description: Release version without a v prefix
        required: true
        type: string
    outputs:
      artifact_name:
        description: Artifact containing both packages and release notes
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Resolve build version
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ActualSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ActualSha -ne $env:EXPECTED_SHA) {
            throw 'Checkout does not match the requested source commit.'
          }
          $Version = $env:REQUESTED_VERSION
          if (-not $Version) {
            $Source = Get-Content src/dllmain.cpp -Raw
            $Match = [regex]::Match($Source, '(?m)^#define P3RFIX_VERSION "(?<version>[^"]+)"\r?$')
            if (-not $Match.Success) { throw 'Cannot determine the development build version.' }
            $Version = $Match.Groups['version'].Value
          }
          if ($Version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Version must have the form X.Y.Z.'
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
          "artifact_name=P3RFix-$Version-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

      - name: Install pinned xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.1.1'

      - name: Check minimal Unreal source inventory
        run: |
          python tools/unreal_inventory.py --phase minimal
          if ($LASTEXITCODE -ne 0) { throw 'Unreal source inventory failed.' }

      - name: Test Unreal integration in debug and release
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          foreach ($Mode in @('debug', 'release')) {
            & xmake f -y -p windows -a x64 -m $Mode "--fix_version=$env:BUILD_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "xmake $Mode configuration failed." }
            & xmake build -y -v unreal-integration-tests
            if ($LASTEXITCODE -ne 0) { throw "Unreal $Mode test build failed." }
            & xmake run unreal-integration-tests
            if ($LASTEXITCODE -ne 0) { throw "Unreal $Mode tests failed." }
          }

      - name: Build and package Windows x64 release
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: ./create_release.ps1 -Version $env:BUILD_VERSION

      - name: Upload packages and release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            build/P3RFix_${{ steps.metadata.outputs.version }}.zip
            build/P3RFix_Reloaded-II.zip
            build/release_body.md
          if-no-files-found: error
          retention-days: 14
